name: Build Android App

# Signed release APK builds for the Android app — kept separate from the
# server CI. Runs on every dev/main push. The release keystore never lives
# in the repo: the workflow decrypts it from GitHub secrets into gradle
# properties, so every APK signs identically. The version string follows the
# Docker convention (plain VERSION on main, "VERSION (sha7)" on dev); when
# this push advances the version and the release workflow creates v{VERSION},
# the APK is attached to it as a release asset.
on:
  push:
    branches: [dev, main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Sync brand icon from single source
        working-directory: frontend
        run: |
          # Must run before the vite build (Layout.tsx imports src/assets/icon.svg)
          mkdir -p src/assets
          cp ../assets/favicon.svg src/assets/icon.svg
          # Legacy launcher bitmaps from the same favicon (needs sharp, just
          # installed); the platform scales/centers/masks them.
          node scripts/sync-android-icon.mjs

      - name: Resolve version string
        run: |
          VERSION=$(cat VERSION)
          SHA=$(git rev-parse --short=7 HEAD)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "VERSION_STR=$VERSION" >> "$GITHUB_ENV"
          else
            echo "VERSION_STR=${VERSION} (${SHA})" >> "$GITHUB_ENV"
          fi
          echo "APK_NAME=gourl-${VERSION}-${SHA}-android-client.apk" >> "$GITHUB_ENV"

      # The SPA footer/login show the resolved string — same injection as the
      # Docker image (VERSION_STR build arg), so the APK and the server build
      # identify themselves identically.
      - name: Build the SPA
        working-directory: frontend
        run: npm run build
        env:
          VERSION_STR: ${{ env.VERSION_STR }}

      - name: Sync web assets into the Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Stamp the Android version
        working-directory: frontend/android
        run: |
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_STR\"/" app/build.gradle
          grep versionName app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Stamp a monotonic version code
        working-directory: frontend/android
        run: |
          echo "VERSION_CODE=$(date -u +%y%j%H%M)" >> gradle.properties

      - name: Import the release keystore from secrets
        working-directory: frontend/android
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
          chmod 600 keystore/release.keystore

      - name: Configure release signing
        working-directory: frontend/android
        run: |
          {
            echo "GOURL_KEYSTORE_FILE=keystore/release.keystore"
            echo "GOURL_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "GOURL_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "GOURL_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> gradle.properties

      - name: Assemble signed release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Stage the APK
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/release/app-release.apk \
            "dist-apk/${APK_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gourl-android-client
          path: dist-apk/
          if-no-files-found: error

      - name: Attach the APK to the release (when this push released one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          # Only attach when THIS push created the release: the version tag
          # must point at this push's HEAD (a pre-existing release for the
          # same version, e.g. a dev build after main, is left alone).
          TAG_SHA=$(gh api "repos/${{ github.repository }}/git/ref/tags/v${VERSION}" -q .object.sha 2>/dev/null || true)
          if [ -z "$TAG_SHA" ] || [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "v${VERSION} was not released on this push; APK stays as artifact"
            exit 0
          fi
          # The release workflow may still be creating it; poll for up to 10
          # minutes (it normally finishes in seconds).
          for i in $(seq 1 60); do
            if gh api "repos/${{ github.repository }}/releases/tags/v${VERSION}" >/dev/null 2>&1; then
              gh release upload "v${VERSION}" "dist-apk/${APK_NAME}" --clobber
              exit 0
            fi
            sleep 10
          done
          echo "release v${VERSION} not found after 10 minutes" >&2
          exit 1
