name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# No concurrency group: every push runs its own full CI, and a newer push
# never cancels an older run.

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # The shared build script puts every go:embed input (dist, locales,
      # icon) in place — reuse it so CI cannot drift from local builds.
      - name: Build frontend into embed locations
        run: scripts/build-frontend.sh

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Sync brand icon from single source
        run: |
          mkdir -p frontend/src/assets
          cp assets/favicon.svg frontend/src/assets/icon.svg

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm run test

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Lint the embedded API spec: catches YAML/schema breakage before the
      # swagger UI at /docs serves a broken document. The built-in
      # "no-unresolved-refs"/"no-empty-servers" style rules stay off — we only
      # want structural validity, not a house style.
      - name: Validate OpenAPI spec (Redocly)
        run: npx --yes @redocly/cli@1 lint --skip-rule=no-server-validation-error internal/webui/openapi.yaml

  e2e:
    runs-on: ubuntu-latest
    needs: [go-test, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Sync brand icon from single source
        run: |
          mkdir -p frontend/src/assets internal/webui
          cp assets/favicon.svg frontend/src/assets/icon.svg
          cp assets/favicon.svg internal/webui/icon.svg

      - name: Build frontend into embed locations
        working-directory: frontend
        run: |
          npm run build
          mkdir -p ../internal/webui/locales
          cp -r dist ../internal/webui/dist
          cp src/locales/en.json src/locales/zh.json ../internal/webui/locales/

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e
