# gourl business configuration.
# Copy to config.yaml (ignored by git) and adjust. Runtime settings and
# secrets (PORT, DB_PATH, REDIS_ADDR, SESSION_SECRET, TZ...) are provided via
# environment variables, not here.
#
# The admin password is stored as a bcrypt hash in the `password_hash` field
# below (written by the /admin/setup flow; never edit it by hand). On first
# start with no hash and no ADMIN_PASSWORD env var, the server runs in setup
# mode and the first visitor sets the password.
site:
  # Service name used in health responses, page footer, admin title and expired pages.
  name: gourl
  # Site title (HTML <title> and meta).
  title: gourl - Short Links
  # meta keywords, comma separated.
  keywords: short link, url shortener
  # meta description.
  description: Lightweight self-hosted URL shortener

# Length of randomly generated short codes (2-64).
short_code_length: 6

# Primary base URL for building full short URLs (empty = infer from request Host).
base_url: ""
# Additional base URLs shown alongside the primary one (copy button, QR codes).
extra_base_urls: []

# Extra reserved short-code prefixes in addition to the built-in list
# (api, admin, expired, health, assets, favicon, export, ...). Case-insensitive.
reserved_codes: []

# Blocked User-Agent patterns (case-insensitive substring match, 403 + no
# click counted). Managed from the settings page, persisted here.
ua_blocks: []

# Banned IP rules: single IP, CIDR network, or IPv4 dotted-quad wildcard
# (e.g. 192.168.*.*). Matched requests are refused on every route — session,
# API and health included — with a 403 page.
ip_blocks: []

# Login rate limiting per client IP: after `login_rate_max_attempts` failed
# logins the address is locked for `login_rate_lock_seconds`. 0 disables.
login_rate_max_attempts: 10
login_rate_lock_seconds: 300

# Admin session expiry in minutes: 0 = sessions never expire (until revoked
# via `gourl reset sessions` or a password change), minimum 5. Only applies to
# newly issued sessions. Default 10080 (7 days).
session_ttl_minutes: 10080

# Shared short-link access budget: at most this many redirects per second
# across all codes (token bucket, burst = same number). Over-limit requests
# get a bare 429 and are not counted. 0 disables.
link_rate_per_second: 100

# Server log verbosity (debug/info/warning/error). Managed from the settings
# page, applied immediately on save.
log_level: info

# Hard-delete links instead of soft-deleting them: every deletion path
# (single, batch, clear expired) physically removes the row. Daily click
# history is always kept; API tokens are unaffected. Default false.
hard_delete: false

# Snapshot the previous version into the backups table before each edit
# (manual edits and batch import conflict=update). Turning it off stops new
# snapshots; existing ones are kept (`gourl reset backups` clears them).
# Default true.
backup_on_edit: true

# Custom icon file name inside the assets data directory (empty = built-in default).
icon: ""

# Bcrypt hash of the admin password. Written by the /admin/setup flow and
# change-password (or migrated once from the legacy ADMIN_PASSWORD env var);
# never exposed via the API. Never edit it by hand — empty = not set up yet.
password_hash: ""

# Session revocation counter. Bumping it instantly invalidates every issued
# admin session. Managed automatically (password change, `gourl reset
# sessions`) — do not edit.
session_epoch: 0

# Gates the admin console (/admin). Toggle with `gourl webui on|off`;
# Swagger /docs stays up either way.
webui_enabled: true

# Gates POST /api/v1/db, the raw SQL console (admin-only, single transaction,
# schema changes refused). Default off. File-only switch like webui_enabled:
# flip it here, then run `gourl reload` — no restart needed.
sql_console_enabled: false
