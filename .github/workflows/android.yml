name: android

# Debug APK builds for the Android app — kept separate from the server CI.
# Runs on every dev/main push. The version string follows the Docker
# convention (plain VERSION on main, "VERSION (sha7)" on dev); when this
# push advances the version and the release workflow creates v{VERSION},
# the APK is attached to it as a release asset.
on:
  push:
    branches: [dev, main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync brand icon from single source
        run: |
          mkdir -p frontend/src/assets
          cp assets/favicon.svg frontend/src/assets/icon.svg

      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Sync web assets into the Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Resolve version string
        run: |
          VERSION=$(cat VERSION)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "VERSION_STR=$VERSION" >> "$GITHUB_ENV"
            echo "APK_NAME=gourl-${VERSION}-debug.apk" >> "$GITHUB_ENV"
          else
            SHA=$(git rev-parse --short=7 HEAD)
            echo "VERSION_STR=${VERSION} (${SHA})" >> "$GITHUB_ENV"
            echo "APK_NAME=gourl-${VERSION}-${SHA}-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Stamp the Android version
        working-directory: frontend/android
        run: |
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_STR\"/" app/build.gradle
          grep versionName app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Assemble debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Stage the APK
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk \
            "dist-apk/${APK_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gourl-debug-apk
          path: dist-apk/
          if-no-files-found: error

      - name: Attach the APK to the release (when this push released one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          # The release workflow only creates v{VERSION} when this push
          # advances the version; poll briefly, then skip (the APK stays a
          # workflow artifact).
          for i in $(seq 1 30); do
            if gh api "repos/${{ github.repository }}/releases/tags/v${VERSION}" >/dev/null 2>&1; then
              gh release upload "v${VERSION}" "dist-apk/${APK_NAME}" --clobber
              exit 0
            fi
            sleep 10
          done
          echo "no release for v${VERSION} on this push; APK stays as artifact"
