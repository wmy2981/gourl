name: android

# Debug APK builds for the Android app — kept separate from the server CI.
# Runs on every version tag (v0.2.0, prereleases included), attaches the APK
# to the matching GitHub release, and uploads it as a workflow artifact.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Sync web assets into the Android project
        working-directory: frontend
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Stage the APK
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk \
            "dist-apk/gourl-${{ github.ref_name }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gourl-debug-apk
          path: dist-apk/
          if-no-files-found: error

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release workflow may still be creating the release when this
          # job starts; poll up to 10 minutes for it to appear.
          for i in $(seq 1 60); do
            if gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" >/dev/null 2>&1; then
              gh release upload "${{ github.ref_name }}" \
                "dist-apk/gourl-${{ github.ref_name }}-debug.apk" --clobber
              exit 0
            fi
            sleep 10
          done
          echo "release ${{ github.ref_name }} not found after 10 minutes" >&2
          exit 1
