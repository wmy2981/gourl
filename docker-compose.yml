services:
  # Single-container deployment: the image embeds a Redis instance that
  # starts automatically unless REDIS_ADDR points elsewhere.
  app:
    image: ghcr.io/wmy2981/gourl:dev
    build: .
    ports:
      - "8080:8080"
    environment:
      # Variables come from the .env file next to this compose file (loaded
      # automatically), e.g.:
      #   ADMIN_PASSWORD=change-me
      #   SESSION_SECRET=$(openssl rand -hex 32)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:-please-change-me}
      # Uncomment to use an external Redis instead of the embedded one:
      # REDIS_ADDR: redis:6379
      # Local timezone: daily click buckets and expires_at are interpreted in it.
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Writable so the settings page can hot-apply config changes.
      - ./config.yaml:/app/config.yaml
      # SQLite database, uploaded icons and the embedded Redis rdb/aof live
      # in the repository-local data directory (no named volumes).
      - ./data:/app/data
    restart: unless-stopped
