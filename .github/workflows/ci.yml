name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# No concurrency group: every push runs its own full CI, and a newer push
# never cancels an older run.

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Sync brand icon from single source
        run: |
          mkdir -p frontend/src/assets internal/webui
          cp assets/favicon.svg frontend/src/assets/icon.svg
          cp assets/favicon.svg internal/webui/icon.svg

      - name: Build frontend into embed location
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../internal/webui
          cp -r dist ../internal/webui/dist

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Sync brand icon from single source
        run: |
          mkdir -p frontend/src/assets
          cp assets/favicon.svg frontend/src/assets/icon.svg

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: [go-test, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Sync brand icon from single source
        run: |
          mkdir -p frontend/src/assets internal/webui
          cp assets/favicon.svg frontend/src/assets/icon.svg
          cp assets/favicon.svg internal/webui/icon.svg

      - name: Build frontend into embed location
        working-directory: frontend
        run: |
          npm run build
          mkdir -p ../internal/webui
          cp -r dist ../internal/webui/dist

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e
