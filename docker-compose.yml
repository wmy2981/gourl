services:
  app:
    image: ghcr.io/wmy2981/gourl:dev
    build: .
    ports:
      - "8080:8080"
    environment:
      # Required secrets; set them in your shell or a .env file.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:-please-change-me}
      REDIS_ADDR: redis:6379
      # Local timezone: daily click buckets and expires_at are interpreted in it.
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Writable so the settings page can hot-apply config changes.
      - ./config.yaml:/app/config.yaml
      - gourl-data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - gourl-redis:/data
    restart: unless-stopped

volumes:
  gourl-data:
  gourl-redis:
