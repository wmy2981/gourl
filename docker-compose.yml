services:
  app:
    # Override with GOURL_IMAGE=ghcr.io/wmy2981/gourl:dev to deploy a
    # pre-release build; latest only exists after a main release.
    image: ${GOURL_IMAGE:-ghcr.io/wmy2981/gourl:latest}
    build: .
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
